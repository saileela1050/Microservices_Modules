#spring.datasource.url=jdbc:mysql://localhost:3306/employee_management
#spring.datasource.username=root
#spring.datasource.password=Admin@123
#spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

external.user-service.base-url=https://jsonplaceholder.typicode.com

department-service.base-url=http://localhost:8081

external.user-service.connect-timeout=3000
external.user-service.response-timeout=5

#circuit breaker properties

# resillence after 50 failures
resilience4j.circuitbreaker.instances.departmentService.failure-rate-threshold=50
#resillence size is 5
resilience4j.circuitbreaker.instances.departmentService.sliding-window-size=5
#resillence calls 5
resilience4j.circuitbreaker.instances.departmentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.departmentService.wait-duration-in-open-state=10s
resillence4j.circuitbreaker.instances.departmentservice.permitted-number-of-calls-in-half-open-state=2

#retry
resillece4j.retry.instances.departmentService.max-attempt=3
resillence4j.retry.instances.departmentService.wait-duration=1s
resilience4j.retry.instances.departmentService.retry-exceptions=org.springframework.web.reactive.function.client.WebClientRequestException




